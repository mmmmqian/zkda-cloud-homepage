<svg xmlns="http://www.w3.org/2000/svg" width="441" height="818" viewBox="0 0 441 818" role="img" aria-label="安全可控 — 动态线形插画"><style>
:root{color-scheme:light}svg{background:transparent;overflow:hidden}
.line,.soft,.super-soft,.blue-line{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;}
.line{stroke:#657080;stroke-width:1.2;opacity:.90}
.soft{stroke:#9DA6B2;stroke-width:1.05;opacity:.66}
.super-soft{stroke:#C8D0DA;stroke-width:1;opacity:.65}
.blue-line{stroke:#1B58F4;stroke-width:1.65;opacity:.97}
.guide{fill:none;stroke:#B9C3CF;stroke-width:.92;stroke-dasharray:1.2 6.4;opacity:.42;vector-effect:non-scaling-stroke}
.dot.blue{fill:#1B58F4}.dot.quiet{fill:#AAB4C2}
.fill-top{fill:#1B58F4;fill-opacity:.94}.fill-left{fill:#1B58F4;fill-opacity:.20}.fill-right{fill:#1B58F4;fill-opacity:.62}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:trace .98s cubic-bezier(.23,.72,.25,1) var(--t,0s) forwards}
.fade{opacity:0;animation:fadein .55s ease-out var(--t,0s) forwards}
@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.trace{animation:none;stroke-dashoffset:0}.fade{animation:none;opacity:1}animateMotion,animate{display:none}}
