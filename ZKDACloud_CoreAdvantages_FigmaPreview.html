const view=document.getElementById('viewport'), figure=document.getElementById('figure'), art=document.getElementById('art');
const firstUndo=document.getElementById('firstUndo'),activeSlice=document.getElementById('activeSlice'),activeBg=document.getElementById('activeBg');
const hits=[...document.querySelectorAll('.hit')], buttons=[...document.querySelectorAll('.key button[data-index]')];
let active=-1, pinned=false, pinnedIndex=0;
function scale(){ figure.style.transform='scale('+(view.getBoundingClientRect().width/1651)+')' }
new ResizeObserver(scale).observe(view);scale();
function select(index,force=false){
  if(index===active && !force)return;active=index;
  art.innerHTML=scenes[index];
  firstUndo.classList.toggle('on',index!==0);
  activeSlice.style.top=ys[index]+'px';
  activeBg.style.top=(-ys[index])+'px';
  activeSlice.classList.toggle('on',index!==0);
  buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));
  hits.forEach((b,i)=>b.setAttribute('aria-label',(i===index?'当前优势：':'查看优势：')+buttons[i].textContent));
}
select(0);
for(let i=0;i<6;i++){
 hits[i].addEventListener('pointerenter',()=>{if(!pinned)select(i)});
 hits[i].addEventListener('focus',()=>{if(!pinned)select(i)});
 hits[i].addEventListener('click',()=>{pinned=true;pinnedIndex=i;select(i,true)});
 buttons[i].addEventListener('pointerenter',()=>{if(!pinned)select(i)});
 buttons[i].addEventListener('focus',()=>{if(!pinned)select(i)});
 buttons[i].addEventListener('click',()=>{pinned=true;pinnedIndex=i;select(i,true)});
}
document.querySelector('.figure').addEventListener('pointerleave',()=>{if(!pinned)select(0)});
document.getElementById('replay').addEventListener('click',()=>select(active,true));
document.addEventListener('keydown',(e)=>{if(e.key==='Escape'){pinned=false;select(0)}});
</script></body></html>
